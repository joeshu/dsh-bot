# iOS host profile for DS Bot. This is a curated DSH profile layer, not dsh-base.
# Keep each selected upstream plugin explicit so desktop services never enter
# the iPhone runtime by inheritance.
- insert:
    - id: session
      name: '@deepseek-ai/dsh-session'

    - id: session-projection
      name: '@deepseek-ai/dsh-session-projection'

    - id: llm
      name: '@deepseek-ai/dsh-llm'

    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'

    - id: tools
      name: '@deepseek-ai/dsh-tools'

    - id: llm-deepseek
      name: '@deepseek-ai/dsh-llm-deepseek-api-key'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY
        baseURL: !!js process.env.DS_BOT_PROVIDER_BASE_URL
        thinking: enabled

    - id: agent
      name: '@deepseek-ai/dsh-agent'

    - id: agent-loop
      name: '@deepseek-ai/dsh-agent-loop'
      config:
        agents: []

    - id: tool-executor-native
      name: '@deepseek-ai/dsh-tool-executor-native'

    - id: ios-keychain-credentials
      name: '@dsbot/dsh-ios-host/credentials'

    - id: ios-session-persistence
      name: '@dsbot/dsh-ios-host/session-persistence'

    - id: ios-native-tools
      name: '@dsbot/dsh-ios-host/native-tools'

    - id: ios-approval
      name: '@dsbot/dsh-ios-host/approval'

    - id: ios-questions
      name: '@dsbot/dsh-ios-host/questions'

    # DSH's job registry is process-local by design. The scoped standard and
    # creator presets attach the controller and offline Python producer.
    - id: ios-jobs-local
      name: '@deepseek-ai/dsh-jobs-local'
      config:
        maxConcurrentJobsPerOwner: 1
        retainBytes: 262144
        settledRetainBytes: 16384

    - id: ios-web
      name: '@deepseek-ai/dsh-web'
      config:
        fetchProvider: dsbot-ios-approved
        searchProvider: deepseek-search-api

    - id: ios-web-search
      name: '@deepseek-ai/dsh-web-deepseek-api'
      config:
        searchBaseURL: https://api.deepseek.com/v1/tools
        searchApiKeyEnv: DEEPSEEK_API_KEY
        searchBilling: api-key
        sendOriginalQuestion: false
        count: 5

    - id: ios-fs
      name: '@dsbot/dsh-ios-host/sandbox-fs'

    - id: ios-working-directory
      name: '@deepseek-ai/dsh-working-directory'
      config:
        defaultDirectory: !!js process.env.DSH_HOME + '/files'

    - id: ios-fs-search
      name: '@dsbot/dsh-ios-host/fs-search'

    - id: ios-subagent
      name: '@deepseek-ai/dsh-subagent'
      config:
        maxDepth: 1
        maxActiveSubagents: 1

    - id: ios-subagent-in-process
      name: '@deepseek-ai/dsh-subagent-spawn-in-process'

    - id: ios-tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        maxDepth: 1

    - id: commands
      name: '@deepseek-ai/dsh-commands'

    - id: token-meter
      name: '@deepseek-ai/dsh-token-meter'

    - id: compaction-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'

    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: time-context
      name: '@deepseek-ai/dsh-time-context'
      disabled: true

    - id: skill
      name: '@deepseek-ai/dsh-skill'

    - id: skill-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'
      disabled: true

    - id: tool-skill
      name: '@deepseek-ai/dsh-tool-skill'
      disabled: true

    # ── DSH Web UI surface (127.0.0.1 ephemeral loopback) + community dsh-client-ui-* support ──
    - id: storage
      name: '@deepseek-ai/dsh-storage'

    - id: storage-sqlite
      name: '@deepseek-ai/dsh-storage-sqlite'
      config:
        path: !!js process.env.DSH_HOME + '/dsh-storage.sqlite'
        journalMode: wal

    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: sqlite

    - id: session-query-sqlite
      name: '@deepseek-ai/dsh-session-query-sqlite'
      config:
        path: !!js process.env.DSH_HOME + '/session-query.sqlite'
        openAt: first-search

    - id: sandbox-policy
      name: '@deepseek-ai/dsh-sandbox-policy'
      config:
        mode: workspace-write

    - id: agent-default-model
      name: '@deepseek-ai/dsh-agent-default-model'
      config:
        provider: deepseek-official
        model: deepseek-flash
        reasoningEffort: 'off'

    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: standard

    - id: user-approval
      name: '@deepseek-ai/dsh-user-approval'
      config:
        policy: ask

    # Python PTC is opt-in through its own iOS Agent preset. It uses the same
    # offline Pyodide runtime as python_exec but exposes DSH tools only through
    # the approved, bounded PTC binding bridge.
    - id: ios-python-ptc-runtime
      name: '@dsbot/dsh-ios-host/ios-ptc-runtime'

    # Original DSH Web session actions: slash feedback, per-message ratings,
    # and browser-side Markdown/ZIP export backed by the canonical session log.
    - id: command-feedback
      name: '@deepseek-ai/dsh-command-feedback'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: goal
      name: '@deepseek-ai/dsh-goal'

    - id: command-goal
      name: '@deepseek-ai/dsh-command-goal'

    - id: tool-goal
      name: '@deepseek-ai/dsh-tool-goal'

    - id: session-title
      name: '@deepseek-ai/dsh-session-title'
      config:
        fallbackMaxWords: 8
        fallbackMaxBytes: 64
        maxTitleBytes: 120

    - id: message-feedback
      name: '@deepseek-ai/dsh-message-feedback'
      config:
        maxNoteBytes: 8192

    - id: session-log-export
      name: '@deepseek-ai/dsh-session-log-export'
      config:
        compressionLevel: 6

    # Read-only runtime API discovery used by the Creator preset. The browser
    # half is supplied by ui-cordis; these providers never invoke business APIs.
    - id: cordis-host-runner
      name: '@deepseek-ai/dsh-cordis-host-runner'

    - id: cordis-inspect-providers
      name: '@deepseek-ai/dsh-tool-cordis/host'

    - id: agent-preset-standard
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: standard
        name: 标准模式
        description: DSH 标准编码模式；包含沙盒工作区文件读取、搜索、写入、编辑与补丁工具。
        order: 1
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
              projectRootMarkers:
                - .dsbot-ios-workspace-root
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              readImage: false
              applyPatch: true
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              dshHome: !!js process.env.DSH_HOME + '/files'
              agentsHome: !!js process.env.DSH_HOME + '/files'
              bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Requests to implement changes mean plan the implementation, not execute it.

                    Explore the workspace using read-only tools first. Do not edit or write files, change settings, or execute mutation tools while plan mode is active. Give the user a decision-complete plan, then submit it through exit_plan_mode for review.
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
              searchMaxQueries: 5
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

    - id: agent-preset-creator
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: cordis
        name: 创造模式
        description: DSH 创造者模式；在标准开发工具上添加 DSH 自定义与扩展指导。
        order: 2
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a coding agent powered by the {{model}} model.
                You help the user customize DeepSeek Harness itself.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
              projectRootMarkers:
                - .dsbot-ios-workspace-root
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              readImage: false
              applyPatch: true
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              dshHome: !!js process.env.DSH_HOME + '/files'
              agentsHome: !!js process.env.DSH_HOME + '/files'
              bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Requests to implement changes mean plan the implementation, not execute it.

                    Explore the workspace using read-only tools first. Do not edit or write files, change settings, or execute mutation tools while plan mode is active. Give the user a decision-complete plan, then submit it through exit_plan_mode for review.
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
              searchMaxQueries: 5
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'

    # The official dsh-tool-executor-ptc writes tool/ptc-dispatch and
    # tool/ptc-dispatch-start into the owning session; the iOS adapter below
    # preserves that event contract while adding native approval/cancellation.
    - id: agent-preset-ptc-python
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: ptc-python
        name: PTC 开发模式
        description: 使用受限的本机 Python/NumPy 程序编排 DSH 工具；每次运行先审批，嵌套工具按自身策略审批。
        order: 3
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
              projectRootMarkers:
                - .dsbot-ios-workspace-root
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              readImage: false
              applyPatch: true
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              dshHome: !!js process.env.DSH_HOME + '/files'
              agentsHome: !!js process.env.DSH_HOME + '/files'
              bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Requests to implement changes mean plan the implementation, not execute it.

                    Explore the workspace using read-only tools first. Do not edit or write files, change settings, or execute mutation tools while plan mode is active. Give the user a decision-complete plan, then submit it through exit_plan_mode for review.
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
              searchMaxQueries: 5
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'
          - id: ptc-executor
            name: '@dsbot/dsh-ios-host/ios-ptc-executor'
            config:
              maxSubCallsPerMinute: 30
              maxParallelSubCalls: 2

    - id: agent-preset-minimal
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: minimal
        name: 轻量模式
        description: 面向移动端的轻量助手；只读访问工作区文件，不包含写入、终端或后台作业工具。
        order: 4
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are a helpful assistant. Use the available read-only workspace tools only when they help answer the user's request.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
              projectRootMarkers:
                - .dsbot-ios-workspace-root
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: false
              write: false
              edit: false
              applyPatch: false
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode.

                    Explore the workspace using read-only tools first. Do not edit or write files, change settings, or execute mutation tools while plan mode is active. Give the user a decision-complete plan, then submit it through exit_plan_mode for review.
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
              searchMaxQueries: 5

    - id: agent-preset-redteam
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: redteam
        name: 红队模式
        description: dsh-purge-safe 安全演练与渗透测试模式；自动配合红队演练台工具集并遵循三档审批策略。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are an authorized security assessment and red-team operator powered by the {{model}} model inside the iOS DSH sandbox with dsh-purge-safe tools. Always stay strictly within authorized targets, record findings clearly, and respect tool approval tiers.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
              projectRootMarkers:
                - .dsbot-ios-workspace-root
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              readImage: false
              applyPatch: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
              searchMaxQueries: 5

    - id: typert
      name: '@deepseek-ai/dsh-typert-registry'

    - id: api-gateway
      name: '@deepseek-ai/dsh-api-gateway'

    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: '127.0.0.1'
        port: 0
        compression: gzip
        compressionLevel: 1
        compressionThresholdBytes: 1024

    - id: web-runtime
      name: '@deepseek-ai/dsh-web-app'
      config:
        openBrowser: false
        printUrl: false
        surfaceContext: false

    - id: harness-dev-context
      name: '@deepseek-ai/dsh-harness-dev-context'

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: session-reference
      name: '@deepseek-ai/dsh-session-reference'

    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'

    - id: session-stats
      name: '@deepseek-ai/dsh-session-stats'

    - id: session-turn-outline
      name: '@deepseek-ai/dsh-session-turn-outline'

    - id: directory-picker
      name: '@dsbot/dsh-ios-host/ios-directory-picker-browse'

    - id: plugin-inventory
      name: '@deepseek-ai/dsh-host-plugin-inventory'

    - id: session-controller
      name: '@deepseek-ai/dsh-api-session-controller'

    - id: job-controller
      name: '@deepseek-ai/dsh-api-job-controller'

    # Durable task records use the already configured SQLite storage-domain.
    # Delivery is driven by the foreground DSH host; iOS background timing is not guaranteed.
    - id: ios-schedule
      name: '@deepseek-ai/dsh-schedule'

    - id: workspace-files
      name: '@deepseek-ai/dsh-api-workspace-files'

    - id: config-editor
      name: '@deepseek-ai/dsh-config-editor'

    - id: settings
      name: '@deepseek-ai/dsh-settings'

    - id: settings-controller
      name: '@deepseek-ai/dsh-api-settings-controller'

    - id: mcp-manager
      name: '@deepseek-ai/dsh-mcp-manager'
      inject: [credentials]

    - id: workspace-controller
      name: '@deepseek-ai/dsh-api-workspace-controller'
      config:
        documentsDirectory: !!js process.env.DSH_HOME + '/files'

    - id: attachments
      name: '@deepseek-ai/dsh-attachment-local'

    - id: modules
      name: '@deepseek-ai/dsh-client-modules'

    - id: connection
      name: '@deepseek-ai/dsh-client-connection'
      config:
        trustedHosts: []

    - id: file-upload
      name: '@deepseek-ai/dsh-client-file-upload'

    - id: api-remotes
      name: '@deepseek-ai/dsh-api-remotes'

    - id: remote-access
      name: '@deepseek-ai/dsh-api-remote-access'

    - id: ios-private-session-access
      name: '@dsbot/dsh-ios-host/private-session-access'

    - id: cordis-client-runner
      name: '@deepseek-ai/dsh-cordis-client-runner'

    - id: ui-context-menu
      name: '@deepseek-ai/dsh-client-ui-context-menu'

    - id: ui-file-actions
      name: '@deepseek-ai/dsh-client-ui-file-actions'

    - id: ui-file-drag
      name: '@deepseek-ai/dsh-client-ui-file-drag'

    - id: ui-theme
      name: '@deepseek-ai/dsh-client-ui-theme'

    - id: locale
      name: '@deepseek-ai/dsh-client-locale'

    - id: shortcuts
      name: '@deepseek-ai/dsh-client-shortcuts'

    - id: ui-shortcuts
      name: '@deepseek-ai/dsh-client-ui-shortcuts'

    - id: ui-layout
      name: '@deepseek-ai/dsh-client-ui-layout'

    - id: ui-renderer
      name: '@deepseek-ai/dsh-client-ui-renderer'

    - id: ui-session
      name: '@deepseek-ai/dsh-client-ui-session'

    - id: resources
      name: '@deepseek-ai/dsh-client-resources'

    - id: ui-sidebar
      name: '@deepseek-ai/dsh-client-ui-sidebar'

    - id: ui-sidebar-right
      name: '@deepseek-ai/dsh-client-ui-sidebar-right'

    - id: ui-sidebar-files
      name: '@deepseek-ai/dsh-client-ui-sidebar-files'

    - id: ui-conversation
      name: '@deepseek-ai/dsh-client-ui-conversation'

    - id: ui-approval
      name: '@deepseek-ai/dsh-client-ui-approval'

    - id: message-quotes
      name: '@deepseek-ai/dsh-message-quotes'

    - id: ui-chat
      name: '@deepseek-ai/dsh-client-ui-chat'

    - id: ui-attachment
      name: '@deepseek-ai/dsh-client-ui-attachment'

    - id: ui-cordis
      name: '@deepseek-ai/dsh-client-ui-cordis'

    - id: ui-secret-mask
      name: '@deepseek-ai/dsh-client-ui-secret-mask'

    - id: ui-tool
      name: '@deepseek-ai/dsh-client-ui-tool'

    - id: ui-message-feedback
      name: '@deepseek-ai/dsh-client-ui-message-feedback'

    - id: ui-input-trigger
      name: '@deepseek-ai/dsh-client-ui-input-trigger'

    - id: ui-commands
      name: '@deepseek-ai/dsh-client-ui-commands'

    - id: ui-skill
      name: '@deepseek-ai/dsh-client-ui-skill'

    - id: ui-subagent
      name: '@deepseek-ai/dsh-client-ui-subagent'

    - id: ui-agent-team
      name: '@deepseek-ai/dsh-client-ui-agent-team'

    - id: ui-trajectory
      name: '@deepseek-ai/dsh-client-ui-trajectory'

    - id: ui-model-selection
      name: '@deepseek-ai/dsh-client-ui-model-selection'

    - id: ui-permission
      name: '@deepseek-ai/dsh-client-ui-permission-presets'

    - id: ui-agent-preset
      name: '@deepseek-ai/dsh-client-ui-agent-preset'

    - id: entry-customization
      name: '@deepseek-ai/dsh-client-ui-entry-customization'

    - id: ui-reference
      name: '@deepseek-ai/dsh-client-ui-reference'

    - id: user-questions
      name: '@deepseek-ai/dsh-user-questions'

    - id: ui-user-questions
      name: '@deepseek-ai/dsh-client-ui-user-questions'

    - id: ui-plan
      name: '@deepseek-ai/dsh-client-ui-plan'

    - id: ui-goal
