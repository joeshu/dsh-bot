# iOS host profile for DS Bot. This is a curated DSH profile layer, not dsh-base.
# Keep each selected upstream plugin explicit so desktop services never enter
# the iPhone runtime by inheritance.
- insert:
    - id: session
      name: '@deepseek-ai/dsh-session'

    - id: session-projection
      name: '@deepseek-ai/dsh-session-projection'

    - id: llm
      name: '@deepseek-ai/dsh-llm'

    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'

    - id: tools
      name: '@deepseek-ai/dsh-tools'

    - id: llm-deepseek
      name: '@deepseek-ai/dsh-llm-deepseek-api-key'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY
        baseURL: !!js process.env.DS_BOT_PROVIDER_BASE_URL
        thinking: enabled

    - id: agent
      name: '@deepseek-ai/dsh-agent'

    - id: agent-loop
      name: '@deepseek-ai/dsh-agent-loop'
      config:
        agents: []

    - id: tool-executor-native
      name: '@deepseek-ai/dsh-tool-executor-native'

    - id: ios-keychain-credentials
      name: '@dsbot/dsh-ios-host/credentials'

    - id: ios-session-persistence
      name: '@dsbot/dsh-ios-host/session-persistence'

    - id: ios-native-tools
      name: '@dsbot/dsh-ios-host/native-tools'

    - id: ios-web
      name: '@deepseek-ai/dsh-web'
      config:
        fetchProvider: dsbot-ios-approved
        searchProvider: deepseek-search-api

    - id: ios-web-search
      name: '@deepseek-ai/dsh-web-deepseek-api'
      config:
        searchBaseURL: https://api.deepseek.com/v1/tools
        searchApiKeyEnv: DEEPSEEK_API_KEY
        searchBilling: api-key
        sendOriginalQuestion: false
        count: 5

    - id: ios-fs
      name: '@dsbot/dsh-ios-host/sandbox-fs'

    - id: ios-working-directory
      name: '@deepseek-ai/dsh-working-directory'
      config:
        defaultDirectory: !!js process.env.DSH_HOME

    - id: ios-subagent
      name: '@deepseek-ai/dsh-subagent'
      config:
        maxDepth: 1
        maxActiveSubagents: 1

    - id: ios-subagent-in-process
      name: '@deepseek-ai/dsh-subagent-spawn-in-process'

    - id: ios-tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        maxDepth: 1

    - id: commands
      name: '@deepseek-ai/dsh-commands'

    - id: token-meter
      name: '@deepseek-ai/dsh-token-meter'

    - id: compaction-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'

    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: time-context
      name: '@deepseek-ai/dsh-time-context'

    - id: skill
      name: '@deepseek-ai/dsh-skill'

    - id: skill-filesystem
      name: '@deepseek-ai/dsh-skill-filesystem'

    - id: tool-skill
      name: '@deepseek-ai/dsh-tool-skill'

    # ── DSH Web UI surface (127.0.0.1 ephemeral loopback) + community dsh-client-ui-* support ──
    - id: webserver
      name: '@deepseek-ai/dsh-host-webserver'
      config:
        host: '127.0.0.1'
        port: 0
        compression: gzip
        compressionLevel: 1
        compressionThresholdBytes: 1024

    - id: web-runtime
      name: '@deepseek-ai/dsh-web-app'
      config:
        openBrowser: false
        printUrl: false
        surfaceContext: false

    - id: modules
      name: '@deepseek-ai/dsh-client-modules'

    - id: connection
      name: '@deepseek-ai/dsh-client-connection'
      config:
        trustedHosts: []

    - id: cordis-client-runner
      name: '@deepseek-ai/dsh-cordis-client-runner'

    - id: plugin-inventory
      name: '@deepseek-ai/dsh-host-plugin-inventory'

    - id: settings-controller
      name: '@deepseek-ai/dsh-api-settings-controller'

    - id: ui-theme
      name: '@deepseek-ai/dsh-client-ui-theme'

    - id: locale
      name: '@deepseek-ai/dsh-client-locale'

    - id: shortcuts
      name: '@deepseek-ai/dsh-client-shortcuts'

    - id: ui-shortcuts
      name: '@deepseek-ai/dsh-client-ui-shortcuts'

    - id: ui-layout
      name: '@deepseek-ai/dsh-client-ui-layout'

    - id: ui-renderer
      name: '@deepseek-ai/dsh-client-ui-renderer'

    - id: ui-session
      name: '@deepseek-ai/dsh-client-ui-session'

    - id: resources
      name: '@deepseek-ai/dsh-client-resources'

    - id: ui-sidebar
      name: '@deepseek-ai/dsh-client-ui-sidebar'

    - id: ui-sidebar-right
      name: '@deepseek-ai/dsh-client-ui-sidebar-right'

    - id: ui-sidebar-files
      name: '@deepseek-ai/dsh-client-ui-sidebar-files'

    - id: ui-conversation
      name: '@deepseek-ai/dsh-client-ui-conversation'

    - id: ui-workspace
      name: '@deepseek-ai/dsh-client-ui-workspace'

    - id: ui-brand-official
      name: '@deepseek-ai/dsh-client-ui-brand-official'

    - id: ui-settings
      name: '@deepseek-ai/dsh-client-ui-settings'

    - id: ui-settings-shell
      name: '@deepseek-ai/dsh-client-ui-settings-shell'

    - id: ui-settings-general
      name: '@deepseek-ai/dsh-client-ui-settings-general'

    - id: ui-settings-models
      name: '@deepseek-ai/dsh-client-ui-settings-models'

    - id: ui-settings-plugins
      name: '@deepseek-ai/dsh-client-ui-settings-plugins'

    - id: ui-plugin-manager
      name: '@deepseek-ai/dsh-client-ui-plugin-manager'
