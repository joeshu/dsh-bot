name: iOS Standalone Unsigned IPA

on:
  push:
    branches: [main, master]
    paths:
      - 'kernel/**'
      - 'ios/**'
      - 'scripts/**'
      - '.github/workflows/ios-ipa-build.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish unsigned IPA + SideStore source.json to GitHub Release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    name: Build Standalone iOS Unsigned IPA (DSH 0.2.2-rc.5)
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('kernel/package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install DSH kernel dependencies (ignore native desktop scripts)
        working-directory: kernel
        run: npm install --ignore-scripts --no-fund --no-audit

      - name: Run DSH 4-gate contract & feature tests
        working-directory: kernel
        run: |
          node scripts/sync-dsh-lock.mjs --check
          npm test

      - name: Build unsigned arm64 IPA & run 4-gate verification
        run: bash scripts/build-unsigned-ipa.sh

      - name: Run Swift XCTest suite on available iOS Simulator
        working-directory: ios
        run: |
          SIM_ID="$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; iphones=[dev['udid'] for rt,devs in sorted(d.items(), reverse=True) if 'iOS' in rt for dev in devs if 'iPhone' in dev['name'] and dev.get('isAvailable')]; print(iphones[0] if iphones else '')")"
          if [ -z "$SIM_ID" ]; then
            echo "::error::No available iPhone simulator found"
            exit 1
          fi
          xcodebuild test \
            -project DSBotStandalone.xcodeproj \
            -scheme DSBotStandalone \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Generate SideStore / AltStore source.json
        run: |
          IPA_FILE="$(ls dist/DS-Bot-iOS-Standalone-*-unsigned.ipa | head -n 1)"
          TAG="v$(node -p "require('./kernel/package.json').version")"
          node scripts/generate-sidestore-source.mjs \
            --repo "${{ github.repository }}" \
            --tag "$TAG" \
            --ipa "$IPA_FILE" \
            --out dist/source.json

      - uses: actions/upload-artifact@v4
        with:
          name: DS-Bot-iOS-Standalone-Unsigned-IPA
          path: |
            dist/*.ipa
            dist/SHA256SUMS.txt
            dist/source.json
            kernel/dist/dsh-kernel-*.bundle
            kernel/dist/kernel-manifest.json
          retention-days: 14
          compression-level: 0

      - name: Publish unsigned IPA & SideStore source.json to GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./kernel/package.json').version")"
          DSH_VER="$(node -p "require('./kernel/dsh.lock.json').dshVersion")"
          IPA_FILE="$(ls dist/DS-Bot-iOS-Standalone-*-unsigned.ipa | head -n 1)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$IPA_FILE" dist/SHA256SUMS.txt dist/source.json \
              "kernel/dist/dsh-kernel-${DSH_VER}.bundle" kernel/dist/kernel-manifest.json --clobber
          else
            gh release create "$TAG" "$IPA_FILE" dist/SHA256SUMS.txt dist/source.json \
              "kernel/dist/dsh-kernel-${DSH_VER}.bundle" kernel/dist/kernel-manifest.json \
              --title "DS-Bot iOS Standalone $TAG (DSH $DSH_VER)" \
              --notes "Unsigned arm64 iOS IPA with embedded hot-swappable DSH $DSH_VER kernel."
          fi
