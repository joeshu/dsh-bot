name: iOS Native IPA

on:
  push:
    paths:
      - 'ios/**'
      - 'kernel/runtime/**'
      - 'kernel/src/**'
      - 'kernel/test/**'
      - 'scripts/**'
      - '.github/workflows/ios-ipa-build.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'kernel/runtime/**'
      - 'kernel/src/**'
      - 'kernel/test/**'
      - 'scripts/**'
      - '.github/workflows/ios-ipa-build.yml'
  workflow_dispatch:
    inputs:
      build_security_runtime:
        description: Build the full NodeMobile 24.22.3 runtime from source (parallel slices)
        type: boolean
        default: false
      publish_runtime_release:
        description: Publish the assembled NodeMobile 24.22.3 XCFramework to Release nodemobile-v24.22.3 so future builds never recompile
        type: boolean
        default: true

permissions:
  contents: write

# A security NodeMobile build is an expensive, pinned source build. Serialize
# those dispatches so two cold runs cannot both miss the same archive cache and
# spend an hour compiling identical device and simulator slices. Regular IPA
# builds keep their own run ID and may still proceed independently.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.build_security_runtime == 'true' && 'security-node-24.22.3' || github.run_id }}
  cancel-in-progress: false

jobs:
  build-security-slice:
    if: github.event_name == 'workflow_dispatch' && inputs.build_security_runtime
    runs-on: macos-26
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        slice: [arm64, arm64-simulator]
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Restore cached ${{ matrix.slice }} slice
        id: slice-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/nodemobile-24.22.3-${{ matrix.slice }}.zip
          key: dsbot-node-24.22.3-${{ matrix.slice }}-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('scripts/build-node-mobile-security-ios.sh') }}
      - name: Compile NodeMobile 24.22.3 (${{ matrix.slice }})
        if: steps.slice-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-node-mobile-security-ios.sh --slice=${{ matrix.slice }} "$RUNNER_TEMP/nodemobile-24.22.3-${{ matrix.slice }}.zip"
      - name: Cache compiled ${{ matrix.slice }} slice
        if: steps.slice-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/nodemobile-24.22.3-${{ matrix.slice }}.zip
          key: ${{ steps.slice-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: nodemobile-24.22.3-${{ matrix.slice }}
          path: ${{ runner.temp }}/nodemobile-24.22.3-${{ matrix.slice }}.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  kernel-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run kernel unit & governance tests
        run: npm --prefix kernel test
      - name: Run Python script regression tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

  candidate:
    needs: [kernel-tests, build-security-slice]
    if: always() && needs.kernel-tests.result == 'success' && (needs.build-security-slice.result == 'success' || needs.build-security-slice.result == 'skipped')
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      DSBOT_REPOSITORY: ${{ github.repository }}
      DSBOT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - name: Pin npm for the runtime lockfile
        run: npm install --global npm@11.9.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install XcodeGen 2.46.0
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          curl --fail --location --retry 3 -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  xcodegen.zip' | shasum -a 256 -c
          unzip -q xcodegen.zip
          XCODEGEN="$(find "${RUNNER_TEMP}" -type f -path '*/bin/xcodegen' -print -quit)"
          test -n "$XCODEGEN"
          dirname "$XCODEGEN" >> "$GITHUB_PATH"
          xcodebuild -version
      - name: Check IPA verification regressions
        run: python3 -m unittest discover -s scripts/tests
      - name: Download device NodeMobile 24.22.3 slice
        if: github.event_name == 'workflow_dispatch' && inputs.build_security_runtime
        uses: actions/download-artifact@v4
        with:
          name: nodemobile-24.22.3-arm64
          path: ${{ runner.temp }}/slices
      - name: Download simulator NodeMobile 24.22.3 slice
        if: github.event_name == 'workflow_dispatch' && inputs.build_security_runtime
        uses: actions/download-artifact@v4
        with:
          name: nodemobile-24.22.3-arm64-simulator
          path: ${{ runner.temp }}/slices
      - name: Assemble NodeMobile 24.22.3 XCFramework
        if: github.event_name == 'workflow_dispatch' && inputs.build_security_runtime
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/nodejs-mobile-ios-24.22.3-dsbot.zip"
          bash scripts/build-node-mobile-security-ios.sh --assemble \
            "$RUNNER_TEMP/slices/nodemobile-24.22.3-arm64.zip" \
            "$RUNNER_TEMP/slices/nodemobile-24.22.3-arm64-simulator.zip" \
            "$archive"
          sha="$(shasum -a 256 "$archive" | cut -d' ' -f1)"
          printf '%s  %s\n' "$sha" "$(basename "$archive")" > "$RUNNER_TEMP/nodejs-mobile-ios-24.22.3-dsbot.sha256"
          echo "DSBOT_SECURITY_NODE_ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "DSBOT_SECURITY_NODE_SHA256=$sha" >> "$GITHUB_ENV"
      - name: Upload assembled NodeMobile 24.22.3 XCFramework artifact
        if: github.event_name == 'workflow_dispatch' && inputs.build_security_runtime
        uses: actions/upload-artifact@v4
        with:
          name: nodemobile-24.22.3-xcframework
          path: |
            ${{ runner.temp }}/nodejs-mobile-ios-24.22.3-dsbot.zip
            ${{ runner.temp }}/nodejs-mobile-ios-24.22.3-dsbot.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Publish NodeMobile 24.22.3 runtime asset to permanent GitHub Release
        if: github.event_name == 'workflow_dispatch' && inputs.build_security_runtime && inputs.publish_runtime_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="nodemobile-v24.22.3"
          ARCHIVE="$RUNNER_TEMP/nodejs-mobile-ios-24.22.3-dsbot.zip"
          SUMFILE="$RUNNER_TEMP/nodejs-mobile-ios-24.22.3-dsbot.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" "$SUMFILE" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" "$SUMFILE" \
              --target "$GITHUB_SHA" \
              --title "NodeMobile iOS 24.22.3 Prebuilt XCFramework" \
              --prerelease --latest=false \
              --notes "Pinned NodeMobile 24.22.3 (iPhoneOS arm64 + Simulator arm64) built from fogtape/nodejs-mobile@b5bcc8d8 with verified upstream Node 24.22.3 security patch. Cached here so future iOS IPA builds never need to recompile Node."
          fi
      - name: Build and verify the unsigned IPA
        env:
          DSBOT_OUT_DIR: ${{ runner.temp }}/dsbot-candidate
        run: bash scripts/build-unsigned-ipa.sh
      - name: Smoke test DSH IPC and SQLite recovery
        run: python3 scripts/smoke-dsh-runtime.py
      - name: Smoke test DeepSeek search approval and privacy boundaries
        run: python3 scripts/smoke-dsh-web-search.py
      - uses: actions/upload-artifact@v4
        with:
          name: dsbot-native-ios-candidate
          path: ${{ runner.temp }}/dsbot-candidate/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Test the native runtime on iOS Simulator
        working-directory: ios
        run: |
          set -euo pipefail
          SIM_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for r, items in sorted(devices.items(), reverse=True) if ".iOS-" in r for d in items if d["name"].startswith("iPhone")))')"
          xcodebuild test -project DSBotStandalone.xcodeproj -scheme DSBotStandalone \
            -destination "platform=iOS Simulator,id=$SIM_ID,arch=arm64" \
            -parallel-testing-enabled NO -resultBundlePath "${RUNNER_TEMP}/DSBotTests.xcresult" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/DSBotTests.xcresult
          if-no-files-found: ignore
