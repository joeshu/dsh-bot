name: iOS Native IPA

on:
  push:
    paths:
      - 'ios/**'
      - 'scripts/**'
      - '.github/workflows/ios-ipa-build.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'scripts/**'
      - '.github/workflows/ios-ipa-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      DSBOT_REPOSITORY: ${{ github.repository }}
      DSBOT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install XcodeGen 2.46.0
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          curl --fail --location --retry 3 -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  xcodegen.zip' | shasum -a 256 -c
          unzip -q xcodegen.zip
          XCODEGEN="$(find "${RUNNER_TEMP}" -type f -path '*/bin/xcodegen' -print -quit)"
          test -n "$XCODEGEN"
          dirname "$XCODEGEN" >> "$GITHUB_PATH"
          xcodebuild -version
      - name: Check IPA verification regressions
        run: python3 -m unittest discover -s scripts/tests
      - name: Build and verify the unsigned IPA
        env:
          DSBOT_OUT_DIR: ${{ runner.temp }}/dsbot-candidate
        run: bash scripts/build-unsigned-ipa.sh
      - name: Test the native runtime on iOS Simulator
        working-directory: ios
        run: |
          set -euo pipefail
          SIM_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for r, items in sorted(devices.items(), reverse=True) if ".iOS-" in r for d in items if d["name"].startswith("iPhone")))')"
          xcodebuild test -project DSBotStandalone.xcodeproj -scheme DSBotStandalone \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -parallel-testing-enabled NO -resultBundlePath "${RUNNER_TEMP}/DSBotTests.xcresult" CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/DSBotTests.xcresult
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: dsbot-native-ios-candidate
          path: ${{ runner.temp }}/dsbot-candidate/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
