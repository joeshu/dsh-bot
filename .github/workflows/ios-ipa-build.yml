name: iOS Native IPA

on:
  push:
    paths:
      - 'ios/**'
      - 'kernel/runtime/**'
      - 'kernel/src/**'
      - 'scripts/**'
      - '.github/workflows/ios-ipa-build.yml'
  pull_request:
    paths:
      - 'ios/**'
      - 'kernel/runtime/**'
      - 'kernel/src/**'
      - 'scripts/**'
      - '.github/workflows/ios-ipa-build.yml'
  workflow_dispatch:
    inputs:
      build_security_runtime:
        description: Build the full NodeMobile 24.22.3 runtime from source
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  candidate:
    runs-on: macos-26
    timeout-minutes: 150
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      DSBOT_REPOSITORY: ${{ github.repository }}
      DSBOT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - name: Pin npm for the runtime lockfile
        run: npm install --global npm@11.9.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install XcodeGen 2.46.0
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}"
          curl --fail --location --retry 3 -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  xcodegen.zip' | shasum -a 256 -c
          unzip -q xcodegen.zip
          XCODEGEN="$(find "${RUNNER_TEMP}" -type f -path '*/bin/xcodegen' -print -quit)"
          test -n "$XCODEGEN"
          dirname "$XCODEGEN" >> "$GITHUB_PATH"
          xcodebuild -version
      - name: Check IPA verification regressions
        run: python3 -m unittest discover -s scripts/tests
      - name: Restore the pinned security NodeMobile build
        if: github.event_name == 'workflow_dispatch' && inputs.build_security_runtime
        id: security-framework-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/node-mobile-security.zip
          key: dsbot-node-mobile-security-${{ runner.os }}-${{ runner.arch }}-xcode-26.6-${{ hashFiles('scripts/build-node-mobile-security-ios.sh') }}
      - name: Compile the security NodeMobile framework
        if: github.event_name == 'workflow_dispatch' && inputs.build_security_runtime && steps.security-framework-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-node-mobile-security-ios.sh "$RUNNER_TEMP/node-mobile-security.zip"
      - name: Select the security NodeMobile archive
        if: github.event_name == 'workflow_dispatch' && inputs.build_security_runtime
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/node-mobile-security.zip"
          test -s "$archive"
          echo "DSBOT_SECURITY_NODE_ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "DSBOT_SECURITY_NODE_SHA256=$(shasum -a 256 "$archive" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Build and verify the unsigned IPA
        env:
          DSBOT_OUT_DIR: ${{ runner.temp }}/dsbot-candidate
        run: bash scripts/build-unsigned-ipa.sh
      - name: Cache the verified security framework
        if: github.event_name == 'workflow_dispatch' && inputs.build_security_runtime && steps.security-framework-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/node-mobile-security.zip
          key: ${{ steps.security-framework-cache.outputs.cache-primary-key }}
      - name: Smoke test DSH IPC and SQLite recovery
        run: python3 scripts/smoke-dsh-runtime.py
      - name: Smoke test DeepSeek search approval and privacy boundaries
        run: python3 scripts/smoke-dsh-web-search.py
      - uses: actions/upload-artifact@v4
        with:
          name: dsbot-native-ios-candidate
          path: ${{ runner.temp }}/dsbot-candidate/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
      - name: Test the native runtime on iOS Simulator
        working-directory: ios
        run: |
          set -euo pipefail
          SIM_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for r, items in sorted(devices.items(), reverse=True) if ".iOS-" in r for d in items if d["name"].startswith("iPhone")))')"
          xcodebuild test -project DSBotStandalone.xcodeproj -scheme DSBotStandalone \
            -destination "platform=iOS Simulator,id=$SIM_ID,arch=arm64" \
            -parallel-testing-enabled NO -resultBundlePath "${RUNNER_TEMP}/DSBotTests.xcresult" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: ${{ runner.temp }}/DSBotTests.xcresult
          if-no-files-found: ignore
