name: ARM64 iOS TCI Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/qemu-ios-tci-runtime.yml
      - scripts/arm64-guest-pty-agent.c
      - scripts/build-arm64-guest-kernel.py
      - scripts/package-qemu-ios-tci.py
      - scripts/patch-utm-qemu-ios-tci.py
      - scripts/prepare-arm64-guest.py
      - scripts/qemu-ios-tci-host-requirements.txt
      - scripts/qemu-ios-tci-sources.sha256
      - scripts/smoke-arm64-guest-boot.py
      - scripts/stage-ios-guest-runtime.py
      - scripts/verify-unsigned-ipa.py
      - scripts/prepare-dsh-runtime.py
      - scripts/tests/**
      - kernel/runtime/**
      - kernel/test/**
      - ios/Sources/**
      - ios/Tests/**
      - ios/project.yml
      - .github/workflows/ios-ipa-release.yml

permissions:
  contents: read

concurrency:
  group: qemu-ios-tci-runtime
  cancel-in-progress: false

jobs:
  build-guest-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install target kernel and static guest agent build tools
        shell: bash
        run: |
          set -euo pipefail
          # Hosted runner images can carry an unrelated Microsoft feed that
          # intermittently returns 403 and aborts apt-get update. This job
          # installs only Ubuntu toolchain packages, so disable that feed for
          # this ephemeral runner before refreshing package indexes.
          shopt -s nullglob
          for source in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            if sudo grep -qi 'packages\.microsoft\.com' "$source"; then
              sudo mv "$source" "${source}.ci-disabled"
            fi
          done
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bc bison flex gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu libc6-dev-arm64-cross \
            libelf-dev libssl-dev make patch perl python3 tar xz-utils

      - name: Build ARM64 kernel and statically linked per-session PTY agent
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-arm64-guest-kernel.py \
            --output "$RUNNER_TEMP/dsbot-arm64-kernel" \
            --cache "$RUNNER_TEMP/dsbot-arm64-kernel-source-cache" \
            --jobs "$(nproc)"
          (cd "$RUNNER_TEMP/dsbot-arm64-kernel" && sha256sum -c SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: dsbot-arm64-linux-guest-kernel-${{ github.sha }}
          path: ${{ runner.temp }}/dsbot-arm64-kernel/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  build:
    needs: build-guest-kernel
    runs-on: macos-26
    timeout-minutes: 240
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      UTM_UPSTREAM_COMMIT: 3d4b8d8cb1ce93a8b1a9610695c12487685f0c15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dsbot-arm64-linux-guest-kernel-${{ github.sha }}
          path: ${{ runner.temp }}/dsbot-arm64-kernel

      - id: qemu-cache-restore
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/qemu-ios-tci-build
          key: qemu-ios-tci-${{ runner.os }}-${{ runner.arch }}-macos26-xcode26.6-utm3d4b8d8-${{ hashFiles('scripts/qemu-ios-tci-sources.sha256', 'scripts/patch-utm-qemu-ios-tci.py', 'scripts/qemu-ios-tci-host-requirements.txt') }}

      - name: Install pinned Meson and Ninja plus Apple build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install --quiet bison flex glib
          python3 -m venv "$RUNNER_TEMP/qemu-venv"
          "$RUNNER_TEMP/qemu-venv/bin/python" -m pip install --require-hashes --no-deps \
            -r "$GITHUB_WORKSPACE/scripts/qemu-ios-tci-host-requirements.txt"
          {
            echo "$RUNNER_TEMP/qemu-venv/bin"
            echo "$(brew --prefix bison)/bin"
            echo "$(brew --prefix flex)/bin"
            echo "$(brew --prefix glib)/bin"
          } >> "$GITHUB_PATH"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Fetch pinned UTM build glue and apply the reviewed minimal target patch
        shell: bash
        run: |
          set -euo pipefail
          UTM_SOURCE="$RUNNER_TEMP/utm-qemu-source"
          mkdir -p "$UTM_SOURCE"
          git -C "$UTM_SOURCE" init --quiet
          git -C "$UTM_SOURCE" remote add origin https://github.com/utmapp/UTM.git
          git -C "$UTM_SOURCE" fetch --quiet --depth 1 origin "$UTM_UPSTREAM_COMMIT"
          git -C "$UTM_SOURCE" checkout --quiet --detach FETCH_HEAD
          [[ "$(git -C "$UTM_SOURCE" rev-parse HEAD)" == "$UTM_UPSTREAM_COMMIT" ]]
          python3 "$GITHUB_WORKSPACE/scripts/patch-utm-qemu-ios-tci.py" "$UTM_SOURCE"

      - name: Build only aarch64-softmmu with TCI and pinned source hashes
        id: qemu-build
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ROOT="$RUNNER_TEMP/qemu-ios-tci-build"
          UTM_SOURCE="$RUNNER_TEMP/utm-qemu-source"
          mkdir -p "$BUILD_ROOT"
          cd "$BUILD_ROOT"
          if [[ "${{ steps.qemu-cache-restore.outputs.cache-hit }}" == "true" && -f "$BUILD_ROOT/build-iOS-TCI-arm64/BUILD_SUCCESS" ]]; then
            echo "Reusing the successful pinned QEMU build cache."
            MINIMAL_TCI=1 \
            SOURCE_HASH_LOCK="$GITHUB_WORKSPACE/scripts/qemu-ios-tci-sources.sha256" \
            NCPU=4 RETRY_ATTEMPTS=5 RETRY_DELAY=10 \
              bash "$UTM_SOURCE/scripts/build_dependencies.sh" -r -p ios-tci -a arm64
          else
            MINIMAL_TCI=1 \
            SOURCE_HASH_LOCK="$GITHUB_WORKSPACE/scripts/qemu-ios-tci-sources.sha256" \
            NCPU=4 RETRY_ATTEMPTS=5 RETRY_DELAY=10 \
              bash "$UTM_SOURCE/scripts/build_dependencies.sh" -p ios-tci -a arm64
          fi

      - name: Save successful pinned QEMU build cache
        if: steps.qemu-build.outcome == 'success'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/qemu-ios-tci-build
          key: qemu-ios-tci-${{ runner.os }}-${{ runner.arch }}-macos26-xcode26.6-utm3d4b8d8-${{ hashFiles('scripts/qemu-ios-tci-sources.sha256', 'scripts/patch-utm-qemu-ios-tci.py', 'scripts/qemu-ios-tci-host-requirements.txt') }}

      - name: Boot the ARM64 guest and exercise its PTY agent
        shell: bash
        run: |
          set -euo pipefail
          brew install --quiet qemu
          GUEST_DIR="$RUNNER_TEMP/dsbot-arm64-guest"
          KERNEL_DIR="$RUNNER_TEMP/dsbot-arm64-kernel"
          python3 "$GITHUB_WORKSPACE/scripts/prepare-arm64-guest.py" \
            --output "$GUEST_DIR" \
            --kernel "$KERNEL_DIR/vmlinuz-dsbot-arm64" \
            --kernel-config "$KERNEL_DIR/config-6.18.60-0-virt" \
            --kernel-manifest "$KERNEL_DIR/kernel-build-manifest.json" \
            --pty-agent "$KERNEL_DIR/dsbot-guest-pty-agent"
          python3 "$GITHUB_WORKSPACE/scripts/smoke-arm64-guest-boot.py" \
            --guest-dir "$GUEST_DIR" \
            --kernel-symbol-map "$KERNEL_DIR/System.map"
          echo "- Minimal ARM64 kernel booted under host QEMU TCG; guest PTY passed executed input/output, job control, resize, Ctrl-C, concurrent workspace isolation, 128 MiB workspace quota, and close checks." >> "$GITHUB_STEP_SUMMARY"

      - name: Stage stripped frameworks, source and license report
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ROOT="$RUNNER_TEMP/qemu-ios-tci-build"
          UTM_SOURCE="$RUNNER_TEMP/utm-qemu-source"
          ARTIFACT_DIR="$RUNNER_TEMP/qemu-ios-tci-artifact"
          python3 "$GITHUB_WORKSPACE/scripts/package-qemu-ios-tci.py" \
            --repo "$GITHUB_WORKSPACE" \
            --upstream "$UTM_SOURCE" \
            --build-dir "$BUILD_ROOT/build-iOS-TCI-arm64" \
            --sysroot "$BUILD_ROOT/sysroot-iOS-TCI-arm64" \
            --output "$ARTIFACT_DIR"
          (cd "$ARTIFACT_DIR" && shasum -a 256 -c SHA256SUMS.txt)
          cat "$ARTIFACT_DIR/build-report.md" >> "$GITHUB_STEP_SUMMARY"

      - id: simulator-cache-restore
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/qemu-ios-simulator-tci-build
          key: qemu-ios-tci-simulator-${{ runner.os }}-${{ runner.arch }}-macos26-xcode26.6-utm3d4b8d8-${{ hashFiles('scripts/qemu-ios-tci-sources.sha256', 'scripts/patch-utm-qemu-ios-tci.py', 'scripts/qemu-ios-tci-host-requirements.txt') }}

      - name: Build ARM64 iOS Simulator TCI frameworks
        id: qemu-simulator-build
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ROOT="$RUNNER_TEMP/qemu-ios-simulator-tci-build"
          UTM_SOURCE="$RUNNER_TEMP/utm-qemu-source"
          mkdir -p "$BUILD_ROOT"
          cd "$BUILD_ROOT"
          if [[ "${{ steps.simulator-cache-restore.outputs.cache-hit }}" == "true" && -f "$BUILD_ROOT/build-iOS_Simulator-TCI-arm64/BUILD_SUCCESS" ]]; then
            echo "Reusing the successful pinned ARM64 iOS Simulator QEMU build cache."
            MINIMAL_TCI=1 \
            SOURCE_HASH_LOCK="$GITHUB_WORKSPACE/scripts/qemu-ios-tci-sources.sha256" \
            NCPU=4 RETRY_ATTEMPTS=5 RETRY_DELAY=10 \
              bash "$UTM_SOURCE/scripts/build_dependencies.sh" -r -p ios_simulator-tci -a arm64
          else
            MINIMAL_TCI=1 \
            SOURCE_HASH_LOCK="$GITHUB_WORKSPACE/scripts/qemu-ios-tci-sources.sha256" \
            NCPU=4 RETRY_ATTEMPTS=5 RETRY_DELAY=10 \
              bash "$UTM_SOURCE/scripts/build_dependencies.sh" -p ios_simulator-tci -a arm64
          fi

      - name: Save successful ARM64 iOS Simulator QEMU build cache
        if: steps.qemu-simulator-build.outcome == 'success'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/qemu-ios-simulator-tci-build
          key: qemu-ios-tci-simulator-${{ runner.os }}-${{ runner.arch }}-macos26-xcode26.6-utm3d4b8d8-${{ hashFiles('scripts/qemu-ios-tci-sources.sha256', 'scripts/patch-utm-qemu-ios-tci.py', 'scripts/qemu-ios-tci-host-requirements.txt') }}

      - name: Audit and package the ARM64 iOS Simulator frameworks
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/package-qemu-ios-tci.py" \
            --repo "$GITHUB_WORKSPACE" \
            --upstream "$RUNNER_TEMP/utm-qemu-source" \
            --build-dir "$RUNNER_TEMP/qemu-ios-simulator-tci-build/build-iOS_Simulator-TCI-arm64" \
            --sysroot "$RUNNER_TEMP/qemu-ios-simulator-tci-build/sysroot-iOS_Simulator-TCI-arm64" \
            --output "$RUNNER_TEMP/qemu-ios-tci-simulator-artifact" \
            --sdk iphonesimulator \
            --source-reference "$RUNNER_TEMP/qemu-ios-tci-artifact"
          (cd "$RUNNER_TEMP/qemu-ios-tci-simulator-artifact" && shasum -a 256 -c SHA256SUMS.txt)
          cat "$RUNNER_TEMP/qemu-ios-tci-simulator-artifact/build-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Stage QEMU and ARM64 guest image for Simulator
        shell: bash
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/scripts/stage-ios-guest-runtime.py" \
            --qemu-artifact-device "$RUNNER_TEMP/qemu-ios-tci-artifact" \
            --qemu-artifact-simulator "$RUNNER_TEMP/qemu-ios-tci-simulator-artifact" \
            --guest-image "$RUNNER_TEMP/dsbot-arm64-guest" \
            --output "$RUNNER_TEMP/dsbot-ios-guest-runtime"

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3

      - name: Pin npm for the iOS runtime lockfile
        run: npm install --global npm@11.9.0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare locked app resources before XcodeGen validates the project
        shell: bash
        env:
          DSBOT_GUEST_RUNTIME_DIR: ${{ runner.temp }}/dsbot-ios-guest-runtime
        run: |
          set -euo pipefail
          npm --prefix kernel/runtime ci --ignore-scripts --omit=optional --no-audit --no-fund
          python3 scripts/prepare-dsh-runtime.py
          python3 scripts/prepare-python-runtime.py
          python3 scripts/prepare-node-mobile-ios.py
          python3 scripts/prepare-quickjs.py

      - name: Install pinned XcodeGen 2.46.0
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 -o xcodegen.zip https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip
          echo '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  xcodegen.zip' | shasum -a 256 -c
          mkdir -p "$RUNNER_TEMP/xcodegen"
          unzip -q xcodegen.zip -d "$RUNNER_TEMP/xcodegen"
          XCODEGEN="$(find "$RUNNER_TEMP/xcodegen" -type f -path '*/bin/xcodegen' -print -quit)"
          test -n "$XCODEGEN"
          dirname "$XCODEGEN" >> "$GITHUB_PATH"
          echo "DSBOT_XCODEGEN=$XCODEGEN" >> "$GITHUB_ENV"

      - name: Generate the iOS Simulator project with the guest runtime staged
        shell: bash
        working-directory: ios
        env:
          DSBOT_GUEST_RUNTIME_DIR: ${{ runner.temp }}/dsbot-ios-guest-runtime
        run: |
          set -euo pipefail
          "$DSBOT_XCODEGEN" generate --spec project.yml

      - name: Boot the in-process QEMU guest in iOS Simulator and run a PTY shell
        shell: bash
        working-directory: ios
        env:
          DSBOT_GUEST_RUNTIME_DIR: ${{ runner.temp }}/dsbot-ios-guest-runtime
        run: |
          set -euo pipefail
          SIM_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for r, items in sorted(devices.items(), reverse=True) if ".iOS-" in r for d in items if d["name"].startswith("iPhone")))')"
          xcodebuild test -project DSBotStandalone.xcodeproj -scheme DSBotStandalone \
            -destination "platform=iOS Simulator,id=$SIM_ID,arch=arm64" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/DSBotQEMUGuestTests.xcresult" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO ENABLE_USER_SCRIPT_SANDBOXING=NO \
            DSBOT_GUEST_RUNTIME_DIR="$RUNNER_TEMP/dsbot-ios-guest-runtime"

      - name: Build and verify the terminal-capable unsigned IPA
        shell: bash
        env:
          DSBOT_GUEST_RUNTIME_DIR: ${{ runner.temp }}/dsbot-ios-guest-runtime
          DSBOT_OUT_DIR: ${{ runner.temp }}/dsbot-native-ios-candidate
          DSBOT_REPOSITORY: ${{ github.repository }}
          DSBOT_COMMIT: ${{ github.sha }}
        run: bash scripts/build-unsigned-ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: dsbot-native-ios-candidate
          path: ${{ runner.temp }}/dsbot-native-ios-candidate/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-ios-tci-report-${{ github.sha }}
          path: |
            ${{ runner.temp }}/qemu-ios-tci-artifact/build-report.json
            ${{ runner.temp }}/qemu-ios-tci-artifact/build-report.md
            ${{ runner.temp }}/qemu-ios-tci-artifact/THIRD-PARTY-NOTICES.md
          if-no-files-found: error
          retention-days: 90
          compression-level: 9

      - uses: actions/upload-artifact@v4
        if: always() && steps.qemu-simulator-build.outcome == 'success'
        with:
          name: qemu-ios-tci-aarch64-${{ github.sha }}
          path: ${{ runner.temp }}/qemu-ios-tci-artifact/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: always() && steps.qemu-simulator-build.outcome == 'success'
        with:
          name: qemu-ios-tci-simulator-arm64-${{ github.sha }}
          path: ${{ runner.temp }}/qemu-ios-tci-simulator-artifact/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-ios-simulator-pty-test-results-${{ github.sha }}
          path: ${{ runner.temp }}/DSBotQEMUGuestTests.xcresult
          if-no-files-found: ignore
          retention-days: 30
          compression-level: 0
