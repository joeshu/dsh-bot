name: DSBotStandalone
options:
  bundleIdPrefix: io.github.dsbot
  deploymentTarget:
    iOS: "16.4"
  xcodeVersion: "26.6"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: NO
    "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""

targets:
  DSBotStandalone:
    type: application
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - path: Sources
        excludes: [Resources]
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/QuickJS-LICENSE.txt
        buildPhase: resources
      - path: Sources/Resources/NodeMobile-LICENSE.txt
        buildPhase: resources
      - path: Sources/Resources/DSHRuntime
        type: folder
        buildPhase: resources
      - path: Vendor/QuickJS/quickjs-amalgam.c
    settings:
      base:
        PRODUCT_NAME: DSBotStandalone
        PRODUCT_BUNDLE_IDENTIFIER: io.github.dsbot.ios.standalone
        MARKETING_VERSION: "2.6.4"
        CURRENT_PROJECT_VERSION: "58"
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ONLY_ACTIVE_ARCH: NO
        SWIFT_OBJC_BRIDGING_HEADER: Sources/JavaScript/JavaScriptInterpreter.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/QuickJS"
        CLANG_C_LANGUAGE_STANDARD: gnu17
    dependencies:
      - framework: Vendor/NodeMobile.xcframework
        embed: true
      - sdk: LocalAuthentication.framework
      - sdk: Security.framework
      - sdk: AVFoundation.framework

  DSBotStandaloneTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.4"
    sources:
      - path: Tests/DSBotStandaloneTests
    dependencies:
      - target: DSBotStandalone
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.dsbot.ios.standalone.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  DSBotStandalone:
    build:
      targets:
        DSBotStandalone: all
        DSBotStandaloneTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DSBotStandaloneTests
    archive:
      config: Release
